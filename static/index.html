<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban Solver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { color: #e94560; margin-bottom: 20px; }

  /* --- Mode tabs --- */
  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
  }
  .mode-tab {
    padding: 10px 28px;
    border: 1px solid #0f3460;
    background: #16213e;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .mode-tab:first-child { border-radius: 6px 0 0 6px; }
  .mode-tab:last-child { border-radius: 0 6px 6px 0; }
  .mode-tab.active { background: #0f3460; color: #e0e0e0; }
  .mode-tab:hover { color: #e0e0e0; }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  select, button, input[type="number"] {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  input[type="number"] {
    width: 60px;
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
    text-align: center;
  }
  select {
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
  }
  button {
    background: #0f3460;
    color: #e0e0e0;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #e94560; }
  button:disabled { opacity: 0.4; cursor: default; }
  label { font-size: 13px; color: #aaa; }

  #grid {
    display: inline-grid;
    gap: 2px;
    margin-bottom: 20px;
    background: #16213e;
    padding: 10px;
    border-radius: 10px;
    user-select: none;
  }
  .cell {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border-radius: 4px;
  }
  .cell-wall { background: #3a3a5c; }
  .cell-floor { background: #232342; }
  .cell-goal { background: #232342; }
  .cell-goal::after { content: ''; width: 12px; height: 12px; background: #e94560; border-radius: 50%; }
  .cell-box { background: #232342; }
  .cell-box::after {
    content: '';
    width: 34px; height: 34px;
    background: #c47f17;
    border-radius: 6px;
    border: 2px solid #a06010;
  }
  .cell-box-on-goal { background: #232342; }
  .cell-box-on-goal::after {
    content: '';
    width: 34px; height: 34px;
    background: #4ecca3;
    border-radius: 6px;
    border: 2px solid #38a882;
  }
  .cell-player { background: #232342; }
  .cell-player::after {
    content: '';
    width: 30px; height: 30px;
    background: #e94560;
    border-radius: 50%;
  }
  .cell-player-on-goal { background: #232342; }
  .cell-player-on-goal::after {
    content: '';
    width: 30px; height: 30px;
    background: #e94560;
    border-radius: 50%;
    border: 3px solid #4ecca3;
  }

  .step-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
  }

  #status {
    background: #16213e;
    padding: 12px 24px;
    border-radius: 8px;
    text-align: center;
    min-width: 300px;
  }
  #status .label { color: #888; font-size: 12px; }
  #status .value { color: #4ecca3; font-weight: bold; }
  #move-display {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
  #move-display .current-move { color: #e94560; font-weight: bold; }

  /* --- Tool palette --- */
  .tool-palette {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tool-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    background: #16213e;
    color: #888;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tool-btn:hover { color: #e0e0e0; }
  .tool-btn.active { border-color: #e94560; color: #e0e0e0; }
  .tool-swatch {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Sokoban Solver</h1>

<div class="mode-tabs">
  <div class="mode-tab active" data-mode="play">Play</div>
  <div class="mode-tab" data-mode="edit">Edit</div>
</div>

<!-- Play mode controls -->
<div id="play-controls" class="controls">
  <select id="puzzle-select"></select>
  <button id="load-btn">Load</button>
  <button id="solve-btn" disabled>Solve</button>
</div>

<!-- Edit mode controls -->
<div id="edit-controls" class="controls hidden">
  <label>Rows</label>
  <input type="number" id="edit-rows" value="6" min="3" max="12">
  <label>Cols</label>
  <input type="number" id="edit-cols" value="6" min="3" max="12">
  <button id="resize-btn">Resize</button>
  <button id="clear-btn">Clear</button>
  <button id="solve-custom-btn">Solve Custom</button>
</div>

<!-- Tool palette (edit mode only) -->
<div id="tool-palette" class="tool-palette hidden">
  <div class="tool-btn active" data-tool="wall"><span class="tool-swatch" style="background:#3a3a5c"></span>Wall</div>
  <div class="tool-btn" data-tool="floor"><span class="tool-swatch" style="background:#232342"></span>Floor</div>
  <div class="tool-btn" data-tool="player"><span class="tool-swatch" style="background:#e94560;border-radius:50%"></span>Player</div>
  <div class="tool-btn" data-tool="box"><span class="tool-swatch" style="background:#c47f17"></span>Box</div>
  <div class="tool-btn" data-tool="goal"><span class="tool-swatch" style="background:#e94560;border-radius:50%;width:10px;height:10px"></span>Goal</div>
</div>

<div id="grid"></div>

<div class="step-controls">
  <button id="prev-btn" disabled>&laquo; Prev</button>
  <button id="play-btn" disabled>Play</button>
  <button id="next-btn" disabled>Next &raquo;</button>
</div>

<div id="status"></div>
<div id="move-display"></div>

<script>
// --- Element refs ---
const puzzleSelect = document.getElementById('puzzle-select');
const loadBtn = document.getElementById('load-btn');
const solveBtn = document.getElementById('solve-btn');
const prevBtn = document.getElementById('prev-btn');
const playBtn = document.getElementById('play-btn');
const nextBtn = document.getElementById('next-btn');
const gridEl = document.getElementById('grid');
const statusEl = document.getElementById('status');
const moveDisplay = document.getElementById('move-display');
const playControls = document.getElementById('play-controls');
const editControls = document.getElementById('edit-controls');
const toolPalette = document.getElementById('tool-palette');
const editRowsInput = document.getElementById('edit-rows');
const editColsInput = document.getElementById('edit-cols');
const resizeBtn = document.getElementById('resize-btn');
const clearBtn = document.getElementById('clear-btn');
const solveCustomBtn = document.getElementById('solve-custom-btn');

// --- State ---
let puzzles = [];
let currentPuzzleText = null;
let grid = null;
let steps = null;
let moves = null;
let stepIndex = 0;
let playInterval = null;
let mode = 'play'; // 'play' or 'edit'
let editorGrid = null; // 2D array
let activeTool = 'wall';
let mouseDown = false;

// --- Mode switching ---
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const newMode = tab.dataset.mode;
    if (newMode === mode) return;
    mode = newMode;
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    stopPlayback();

    if (mode === 'play') {
      playControls.classList.remove('hidden');
      editControls.classList.add('hidden');
      toolPalette.classList.add('hidden');
      gridEl.innerHTML = '';
      steps = null; moves = null;
      statusEl.innerHTML = '';
      moveDisplay.innerHTML = '';
      solveBtn.disabled = true;
      setStepButtonState();
    } else {
      playControls.classList.add('hidden');
      editControls.classList.remove('hidden');
      toolPalette.classList.remove('hidden');
      steps = null; moves = null;
      statusEl.innerHTML = '<span class="value">Click cells to design your puzzle.</span>';
      moveDisplay.innerHTML = '';
      setStepButtonState();
      if (!editorGrid) initEditorGrid(6, 6);
      renderEditorGrid();
    }
  });
});

// --- Tool palette ---
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// --- Init puzzles ---
fetch('/api/puzzles')
  .then(r => r.json())
  .then(data => {
    puzzles = data;
    puzzles.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      puzzleSelect.appendChild(opt);
    });
  });

// ============================================================
// PLAY MODE
// ============================================================

loadBtn.addEventListener('click', () => {
  stopPlayback();
  const selected = puzzles.find(p => p.id === puzzleSelect.value);
  if (!selected) return;
  currentPuzzleText = selected.text;
  loadPuzzleText(currentPuzzleText);
  solveBtn.disabled = false;
  statusEl.innerHTML = '<span class="value">Puzzle loaded. Click Solve.</span>';
  moveDisplay.innerHTML = '';
});

function loadPuzzleText(text) {
  steps = null; moves = null; stepIndex = 0;
  const lines = text.split('\n');
  const rows = lines.length;
  const cols = Math.max(...lines.map(l => l.length));
  const walls = [], goals = [], boxes = [];
  let player = null;
  for (let r = 0; r < lines.length; r++) {
    for (let c = 0; c < lines[r].length; c++) {
      const ch = lines[r][c];
      if (ch === '#') walls.push([r, c]);
      else if (ch === '@') player = [r, c];
      else if (ch === '+') { player = [r, c]; goals.push([r, c]); }
      else if (ch === '$') boxes.push([r, c]);
      else if (ch === '*') { boxes.push([r, c]); goals.push([r, c]); }
      else if (ch === '.') goals.push([r, c]);
    }
  }
  grid = { walls, goals, dimensions: [rows, cols] };
  steps = [{ player, boxes }];
  stepIndex = 0;
  renderGrid();
  setStepButtonState();
}

solveBtn.addEventListener('click', () => solvePuzzle(currentPuzzleText, solveBtn));

function solvePuzzle(puzzleText, btnToDisable) {
  stopPlayback();
  if (btnToDisable) btnToDisable.disabled = true;
  statusEl.innerHTML = '<span class="value">Solving...</span>';

  fetch('/api/solve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ puzzle: puzzleText }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.solved) {
        grid = data.grid;
        steps = data.steps;
        moves = data.moves;
        stepIndex = 0;
        renderGrid();
        setStepButtonState();
        statusEl.innerHTML =
          `<span class="label">Moves:</span> <span class="value">${moves.length}</span> &nbsp; ` +
          `<span class="label">States:</span> <span class="value">${data.stats.states_explored}</span> &nbsp; ` +
          `<span class="label">Time:</span> <span class="value">${data.stats.time}s</span>`;
        renderMoveList();
      } else {
        statusEl.innerHTML = `<span class="value" style="color:#e94560">${data.error}</span>`;
        if (btnToDisable) btnToDisable.disabled = false;
      }
    })
    .catch(err => {
      statusEl.innerHTML = `<span class="value" style="color:#e94560">Error: ${err.message}</span>`;
      if (btnToDisable) btnToDisable.disabled = false;
    });
}

// --- Step controls ---
prevBtn.addEventListener('click', () => { stopPlayback(); goStep(stepIndex - 1); });
nextBtn.addEventListener('click', () => { stopPlayback(); goStep(stepIndex + 1); });
playBtn.addEventListener('click', () => {
  if (playInterval) {
    stopPlayback();
  } else {
    if (stepIndex >= steps.length - 1) stepIndex = 0;
    playBtn.textContent = 'Pause';
    playInterval = setInterval(() => {
      if (stepIndex >= steps.length - 1) { stopPlayback(); return; }
      goStep(stepIndex + 1);
    }, 400);
  }
});

function stopPlayback() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
  playBtn.textContent = 'Play';
}

function goStep(i) {
  if (!steps || i < 0 || i >= steps.length) return;
  stepIndex = i;
  renderGrid();
  setStepButtonState();
  renderMoveList();
}

function setStepButtonState() {
  const hasSolution = steps && steps.length > 1;
  prevBtn.disabled = !hasSolution || stepIndex <= 0;
  nextBtn.disabled = !hasSolution || stepIndex >= steps.length - 1;
  playBtn.disabled = !hasSolution;
}

// --- Rendering (play mode / solution playback) ---
function renderGrid() {
  if (!grid || !steps) return;
  const [rows, cols] = grid.dimensions;
  const step = steps[stepIndex];

  const wallSet = new Set(grid.walls.map(w => w[0] + ',' + w[1]));
  const goalSet = new Set(grid.goals.map(g => g[0] + ',' + g[1]));
  const boxSet = new Set(step.boxes.map(b => b[0] + ',' + b[1]));
  const playerKey = step.player[0] + ',' + step.player[1];

  gridEl.style.gridTemplateColumns = `repeat(${cols}, 48px)`;
  gridEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const key = r + ',' + c;

      if (wallSet.has(key)) cell.classList.add('cell-wall');
      else if (key === playerKey && goalSet.has(key)) cell.classList.add('cell-player-on-goal');
      else if (key === playerKey) cell.classList.add('cell-player');
      else if (boxSet.has(key) && goalSet.has(key)) cell.classList.add('cell-box-on-goal');
      else if (boxSet.has(key)) cell.classList.add('cell-box');
      else if (goalSet.has(key)) cell.classList.add('cell-goal');
      else cell.classList.add('cell-floor');

      gridEl.appendChild(cell);
    }
  }
}

function renderMoveList() {
  if (!moves || moves.length === 0) { moveDisplay.innerHTML = ''; return; }
  const dirLabels = { U: '\u2191', D: '\u2193', L: '\u2190', R: '\u2192' };
  const parts = moves.map((m, i) => {
    const label = dirLabels[m] || m;
    if (i + 1 === stepIndex) return `<span class="current-move">${label}</span>`;
    return `<span>${label}</span>`;
  });
  moveDisplay.innerHTML = `Step ${stepIndex}/${steps.length - 1}: ` + parts.join(' ');
}

// ============================================================
// EDIT MODE
// ============================================================

function initEditorGrid(rows, cols) {
  editorGrid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
        row.push('wall');
      } else {
        row.push('floor');
      }
    }
    editorGrid.push(row);
  }
}

function cellClass(type) {
  const map = {
    wall: 'cell-wall',
    floor: 'cell-floor',
    player: 'cell-player',
    box: 'cell-box',
    goal: 'cell-goal',
    player_on_goal: 'cell-player-on-goal',
    box_on_goal: 'cell-box-on-goal',
  };
  return map[type] || 'cell-floor';
}

function renderEditorGrid() {
  if (!editorGrid) return;
  const rows = editorGrid.length;
  const cols = editorGrid[0].length;

  gridEl.style.gridTemplateColumns = `repeat(${cols}, 48px)`;
  gridEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + cellClass(editorGrid[r][c]);
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener('mousedown', (e) => {
        e.preventDefault();
        mouseDown = true;
        applyTool(r, c);
      });
      cell.addEventListener('mouseover', () => {
        if (mouseDown) applyTool(r, c);
      });

      gridEl.appendChild(cell);
    }
  }
}

document.addEventListener('mouseup', () => { mouseDown = false; });

function hasGoal(type) {
  return type === 'goal' || type === 'player_on_goal' || type === 'box_on_goal';
}

function applyTool(r, c) {
  const current = editorGrid[r][c];

  if (activeTool === 'wall') {
    editorGrid[r][c] = 'wall';
  } else if (activeTool === 'floor') {
    // Clearing: if compound, preserve the goal
    if (current === 'player_on_goal' || current === 'box_on_goal') {
      editorGrid[r][c] = 'goal';
    } else {
      editorGrid[r][c] = 'floor';
    }
  } else if (activeTool === 'player') {
    // Remove existing player first
    removePlayer();
    editorGrid[r][c] = hasGoal(current) ? 'player_on_goal' : 'player';
  } else if (activeTool === 'box') {
    editorGrid[r][c] = hasGoal(current) ? 'box_on_goal' : 'box';
  } else if (activeTool === 'goal') {
    if (current === 'player' || current === 'player_on_goal') {
      editorGrid[r][c] = 'player_on_goal';
    } else if (current === 'box' || current === 'box_on_goal') {
      editorGrid[r][c] = 'box_on_goal';
    } else {
      editorGrid[r][c] = 'goal';
    }
  }

  renderEditorGrid();
  updateEditorStatus();
}

function removePlayer() {
  for (let r = 0; r < editorGrid.length; r++) {
    for (let c = 0; c < editorGrid[0].length; c++) {
      if (editorGrid[r][c] === 'player') editorGrid[r][c] = 'floor';
      if (editorGrid[r][c] === 'player_on_goal') editorGrid[r][c] = 'goal';
    }
  }
}

function countType(type) {
  let n = 0;
  for (const row of editorGrid) {
    for (const cell of row) {
      if (cell === type) n++;
    }
  }
  return n;
}

function updateEditorStatus() {
  const players = countType('player') + countType('player_on_goal');
  const boxes = countType('box') + countType('box_on_goal');
  const goals = countType('goal') + countType('player_on_goal') + countType('box_on_goal');
  statusEl.innerHTML =
    `<span class="label">Player:</span> <span class="value">${players}</span> &nbsp; ` +
    `<span class="label">Boxes:</span> <span class="value">${boxes}</span> &nbsp; ` +
    `<span class="label">Goals:</span> <span class="value">${goals}</span>`;
}

function validateGrid() {
  const players = countType('player') + countType('player_on_goal');
  const boxes = countType('box') + countType('box_on_goal');
  const goals = countType('goal') + countType('player_on_goal') + countType('box_on_goal');

  if (players !== 1) return 'Puzzle must have exactly 1 player.';
  if (boxes === 0) return 'Puzzle must have at least 1 box.';
  if (boxes !== goals) return `Number of boxes (${boxes}) must equal number of goals (${goals}).`;
  return null;
}

function serializeGrid() {
  const symbolMap = {
    wall: '#', floor: ' ', player: '@', box: '$',
    goal: '.', player_on_goal: '+', box_on_goal: '*',
  };
  return editorGrid.map(row => row.map(c => symbolMap[c] || ' ').join('')).join('\n');
}

// --- Editor buttons ---
resizeBtn.addEventListener('click', () => {
  const rows = Math.max(3, Math.min(12, parseInt(editRowsInput.value) || 6));
  const cols = Math.max(3, Math.min(12, parseInt(editColsInput.value) || 6));
  editRowsInput.value = rows;
  editColsInput.value = cols;
  initEditorGrid(rows, cols);
  renderEditorGrid();
  updateEditorStatus();
  steps = null; moves = null;
  setStepButtonState();
  moveDisplay.innerHTML = '';
});

clearBtn.addEventListener('click', () => {
  const rows = editorGrid.length;
  const cols = editorGrid[0].length;
  initEditorGrid(rows, cols);
  renderEditorGrid();
  updateEditorStatus();
  steps = null; moves = null;
  setStepButtonState();
  moveDisplay.innerHTML = '';
});

solveCustomBtn.addEventListener('click', () => {
  const error = validateGrid();
  if (error) {
    statusEl.innerHTML = `<span class="value" style="color:#e94560">${error}</span>`;
    return;
  }
  currentPuzzleText = serializeGrid();

  // Switch display to play-style rendering for solution playback
  loadPuzzleText(currentPuzzleText);
  solvePuzzle(currentPuzzleText, solveCustomBtn);
});
</script>
</body>
</html>
